openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Wildpixels Photography Portfolio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trips
    description: Photography trip operations
  - name: photos
    description: Photo operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: List all trips
      responses:
        "200":
          description: List of trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trip"

  /trips/featured:
    get:
      operationId: getFeaturedTrips
      tags: [trips]
      summary: Get featured trips for homepage hero
      responses:
        "200":
          description: Featured trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trip"

  /trips/stats:
    get:
      operationId: getTripStats
      tags: [trips]
      summary: Get portfolio-wide stats
      responses:
        "200":
          description: Portfolio stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioStats"

  /trips/{id}:
    get:
      operationId: getTrip
      tags: [trips]
      summary: Get a single trip with its photos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trip details with photos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDetail"
        "404":
          description: Not found

  /photos:
    get:
      operationId: listPhotos
      tags: [photos]
      summary: List all photos, optionally filtered by trip
      parameters:
        - name: tripId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Photo"

  /photos/highlights:
    get:
      operationId: getHighlightPhotos
      tags: [photos]
      summary: Get highlight photos across all trips
      responses:
        "200":
          description: Highlight photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Photo"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Trip:
      type: object
      required: [id, title, location, country, month, year, coverImageUrl, photoCount, tags, featured]
      properties:
        id:
          type: integer
        title:
          type: string
        location:
          type: string
        country:
          type: string
        month:
          type: string
        year:
          type: integer
        story:
          type: ["string", "null"]
        coverImageUrl:
          type: string
        photoCount:
          type: integer
        tags:
          type: array
          items:
            type: string
        featured:
          type: boolean
        storySummary:
          type: ["string", "null"]
        travelTips:
          type: ["string", "null"]

    TripDetail:
      type: object
      required: [id, title, location, country, month, year, story, coverImageUrl, photoCount, tags, featured, photos]
      properties:
        id:
          type: integer
        title:
          type: string
        location:
          type: string
        country:
          type: string
        month:
          type: string
        year:
          type: integer
        story:
          type: string
        coverImageUrl:
          type: string
        photoCount:
          type: integer
        tags:
          type: array
          items:
            type: string
        featured:
          type: boolean
        storySummary:
          type: ["string", "null"]
        travelTips:
          type: ["string", "null"]
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"

    Photo:
      type: object
      required: [id, tripId, imageUrl, caption, isHighlight]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        imageUrl:
          type: string
        caption:
          type: ["string", "null"]
        isHighlight:
          type: boolean

    PortfolioStats:
      type: object
      required: [tripCount, countryCount, photoCount]
      properties:
        tripCount:
          type: integer
        countryCount:
          type: integer
        photoCount:
          type: integer
