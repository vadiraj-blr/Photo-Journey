kind = "video"
previewPath = "/wildpixels-video/"
title = "Wildpixels – Promo Video"
version = "1.0.0"
id = "artifacts/wildpixels-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/wildpixels-video/" ]
localPort = 19616

[services.development]
run = "pnpm --filter @workspace/wildpixels-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wildpixels-video", "run", "build" ]
publicDir = "artifacts/wildpixels-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19616"
BASE_PATH = "/wildpixels-video/"
