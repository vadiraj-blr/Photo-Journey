<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta httpEquiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Wildpixels</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Map the app's native font names onto the web Inter family */
    @font-face { font-family: 'Inter_400Regular';  src: local('Inter'); font-weight: 400; }
    @font-face { font-family: 'Inter_500Medium';   src: local('Inter'); font-weight: 500; }
    @font-face { font-family: 'Inter_600SemiBold'; src: local('Inter'); font-weight: 600; }
    @font-face { font-family: 'Inter_700Bold';     src: local('Inter'); font-weight: 700; }

    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #080808;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      min-height: 100dvh;
      overscroll-behavior-y: none;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    #root {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
